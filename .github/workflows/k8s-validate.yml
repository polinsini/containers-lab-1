name: Validate Kubernetes Manifests

on:
push:
paths:
- 'k8s/**/*.yaml'
- '.github/workflows/k8s-validate.yml'

jobs:
validate:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Install kubeval
    run: |
      curl -L -o kubeval.tar.gz https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
      tar xf kubeval.tar.gz
      sudo mv kubeval /usr/local/bin

  - name: Validate Kubernetes manifests
    run: |
      kubeval --strict --ignore-missing-schemas k8s/*.yaml

  - name: Lint YAML files
    uses: ibiqlik/action-yamllint@v3
    with:
      file_or_dir: k8s/
      config_file: .yamllint.yml

